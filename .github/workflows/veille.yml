name: Veille

on:
  schedule:
    # Toutes les 2 heures, à l'heure pile (heures paires UTC, soit 11 h, 13 h, 15 h, 17 h… à Nouméa).
    # Le passage de 17 h (06:00 UTC) prépare le récapitulatif quotidien par e-mail.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_digest:
        description: Envoyer tout de suite le récapitulatif par e-mail (e-mail de test si rien n'est en attente)
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '**/*.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    name: Vérifier les sources et publier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Lancer les tests
        if: github.event_name == 'push'
        run: npm test

      - name: Vérifier les sources
        env:
          VIGIE_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VIGIE_FORCE_DIGEST: ${{ inputs.force_digest && '1' || '' }}
        run: npm run scrape -- --digest recap.json

      - name: Envoyer le récapitulatif par e-mail
        if: hashFiles('recap.json') != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VIGIE_EMAIL_TO: ${{ secrets.VIGIE_EMAIL_TO }}
        run: node scripts/send-digest.js recap.json

      - name: Enregistrer les nouvelles annonces
        run: |
          git config user.name "vigie[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/snapshots data/alert-queue.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée à enregistrer."
          else
            git add data/status.json
            git commit -m "Veille : mise à jour des annonces"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
              sleep 5
            done
          fi

      - name: Préparer le site
        run: npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Publier en ligne
        id: deployment
        uses: actions/deploy-pages@v5.0.1
